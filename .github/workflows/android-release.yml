name: Android release

# Builds the signed app for Google Play (.aab) and a signed .apk to install
# directly, without Android Studio. Run it from GitHub → Actions → Android
# release → Run workflow, then download the files from the run's Artifacts.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions),
# see README → Android app → Release build for Google Play:
#   ANDROID_KEYSTORE_BASE64   the upload key (.jks), base64-encoded
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      optional: android/app/google-services.json, for call
#                             notifications (Firebase), if it isn't committed
#   PLAY_SERVICE_ACCOUNT_JSON optional: a Google Play service account key, to
#                             upload the .aab to Google Play by itself (see
#                             docs/PLAY_STORE.md → Automatic uploads)
# and, for "Continue with Google" in the app, the repository variable
# (Variables tab, not Secrets) GOOGLE_WEB_CLIENT_ID.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version people see in Google Play (for example 1.0.1)'
        required: true
        default: '1.0'
      track:
        description: 'Upload to Google Play (needs PLAY_SERVICE_ACCOUNT_JSON). Production is always released by hand in Play Console.'
        type: choice
        options:
          - internal
          - closed testing
          - none (only build)
        default: internal

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Always goes up, as Google Play requires; the run number of this workflow.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see README → Android app)."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "::warning::No google-services.json: this build can't ring when the app is closed (see README → Set up → 10)."
          fi

      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - run: npx cap sync android

      - name: Build and sign
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Name the files after the version
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab "release/add-call-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "release/add-call-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}.apk"
          echo "Built version ${ANDROID_VERSION_NAME} (code ${ANDROID_VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: add-call-${{ inputs.version_name }}-${{ github.run_number }}
          path: release/
          retention-days: 30

      # Google Play names the closed testing track "alpha".
      - name: Choose the Google Play track
        if: inputs.track != 'none (only build)'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::No PLAY_SERVICE_ACCOUNT_JSON secret, so the .aab wasn't uploaded to Google Play; download it from Artifacts (see docs/PLAY_STORE.md → Automatic uploads)."
            exit 0
          fi
          case "${{ inputs.track }}" in
            internal) track=internal ;;
            'closed testing') track=alpha ;;
          esac
          echo "PLAY_TRACK=$track" >> "$GITHUB_ENV"

      - name: Upload to Google Play
        if: env.PLAY_TRACK != ''
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.adddots.call
          releaseFiles: release/*.aab
          releaseName: ${{ inputs.version_name }} (${{ github.run_number }})
          track: ${{ env.PLAY_TRACK }}
          status: completed

      - name: Say where it went
        if: env.PLAY_TRACK != ''
        run: echo "Uploaded to Google Play → ${{ inputs.track }}" >> "$GITHUB_STEP_SUMMARY"
