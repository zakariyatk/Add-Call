apply plugin: 'com.android.application'

// Release signing with the Google Play upload key. Put the details in
// android/keystore.properties (never committed, see README → Android app):
//   storeFile=add-call-upload.jks      (relative to android/, or a full path)
//   storePassword=…
//   keyAlias=upload
//   keyPassword=…
// or in the environment variables ANDROID_STORE_FILE, ANDROID_STORE_PASSWORD,
// ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (for automated builds).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_STORE_FILE')

android {
    namespace = "com.adddots.call"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.adddots.call"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every upload to Google Play needs a higher versionCode. The release
        // workflow sets it from its run number; local builds use these defaults.
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Calls and messages while the app is closed (see CallMessagingService).
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
